{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card profile-edit-card">
            <div class="card-header"><i class="fas fa-key me-2"></i>Reset Password for {{ target_user.pzc }}</div>
            <div class="card-body p-4">
                <form method="post" class="row g-3">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="col-12">
                        <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-check me-1"></i>Set Password</button>
                        <a href="{% url 'accounts:admin_user_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
