{% extends 'base.html' %}
{% block content %}
<h2 class="dashboard-title"><i class="fas fa-plus-circle"></i> New IT Request</h2>
<p class="dashboard-subtitle">Submit a new request</p>

<div class="card">
    <div class="card-header"><i class="fas fa-file-alt me-2"></i>Request Form</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary mt-3"><i class="fas fa-paper-plane me-1"></i>Submit Request</button>
        </form>
    </div>
</div>
{% endblock %}
